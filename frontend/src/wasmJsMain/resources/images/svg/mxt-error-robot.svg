<svg xmlns="http://www.w3.org/2000/svg" width="480" height="340" viewBox="0 0 480 340" role="img">
  <style>
    .robot { transform-origin: 196px 300px; animation: sway 3.2s ease-in-out infinite; }
    .head { transform-origin: 196px 150px; animation: tilt 3.2s ease-in-out infinite; }
    .bulb { animation: blink 1.6s steps(1, end) infinite; }
    .tear { animation: tear 2.4s ease-in infinite; }
    .spark { transform-origin: 352px 262px; animation: spark 0.9s ease-out infinite; }
    .spark-2 { animation-delay: 0.45s; }
    .bubble { transform-origin: 300px 92px; animation: float 3.2s ease-in-out infinite; }
    @keyframes sway { 0%, 100% { transform: rotate(-2deg); } 50% { transform: rotate(2deg); } }
    @keyframes tilt { 0%, 100% { transform: rotate(-4deg); } 50% { transform: rotate(3deg); } }
    @keyframes blink { 0%, 60% { fill: #ff8d4e; } 61%, 100% { fill: #ffffff; } }
    @keyframes tear { 0%, 30% { transform: translateY(0); opacity: 0; } 40% { opacity: 1; } 100% { transform: translateY(26px); opacity: 0; } }
    @keyframes spark { 0% { transform: scale(0.4); opacity: 0; } 30% { opacity: 1; } 100% { transform: scale(1.2); opacity: 0; } }
    @keyframes float { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-6px); } }
    @media (prefers-reduced-motion: reduce) {
      .robot, .head, .bulb, .tear, .spark, .bubble { animation: none; }
      .tear { opacity: 0; }
    }
  </style>

  <!-- Background -->
  <circle cx="240" cy="180" r="150" fill="#aecbd6" opacity="0.45"/>
  <ellipse cx="250" cy="304" rx="190" ry="14" fill="#2c233d" opacity="0.12"/>

  <!-- Speech bubble "404" -->
  <g class="bubble">
    <path d="M262 52h92a14 14 0 0 1 14 14v38a14 14 0 0 1-14 14h-58l-18 16v-16h-16a14 14 0 0 1-14-14V66a14 14 0 0 1 14-14z" fill="#ffffff" stroke="#2c233d" stroke-width="3" stroke-linejoin="round"/>
    <text x="308" y="97" text-anchor="middle" font-family="Arial, sans-serif" font-size="30" font-weight="900" fill="#2c233d">?!</text>
  </g>

  <!-- Broken microphone on the floor -->
  <path d="M250 296c30 6 40-14 70-10s40 14 60 4" fill="none" stroke="#2c233d" stroke-width="3" stroke-linecap="round"/>
  <g transform="rotate(-18 352 262)">
    <rect x="322" y="254" width="64" height="16" rx="8" fill="#ffffff" stroke="#2c233d" stroke-width="3"/>
    <rect x="380" y="250" width="12" height="24" rx="4" fill="#2c233d"/>
  </g>
  <g transform="rotate(14 300 280)">
    <circle cx="300" cy="280" r="22" fill="#ffffff" stroke="#2c233d" stroke-width="3"/>
    <path d="M285 272h30M282 280h36M285 288h30" stroke="#2c233d" stroke-width="2" stroke-linecap="round"/>
    <path d="M296 258l6 10-5 6 7 10" fill="none" stroke="#f42d76" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
  <!-- Sparks -->
  <g class="spark">
    <path d="M352 236v-14M368 244l9-9M336 244l-9-9" stroke="#fadc40" stroke-width="4" stroke-linecap="round"/>
  </g>
  <g class="spark spark-2">
    <path d="M360 230l4-12M344 232l-6-10" stroke="#ff8d4e" stroke-width="4" stroke-linecap="round"/>
  </g>

  <!-- Robot -->
  <g class="robot">
    <!-- legs -->
    <path d="M182 262v34M210 262v34" stroke="#2c233d" stroke-width="6" stroke-linecap="round"/>
    <path d="M170 298h22M200 298h22" stroke="#2c233d" stroke-width="7" stroke-linecap="round"/>
    <!-- body -->
    <rect x="156" y="190" width="80" height="78" rx="18" fill="#ffffff" stroke="#2c233d" stroke-width="3"/>
    <circle cx="196" cy="222" r="12" fill="#22ba90" stroke="#2c233d" stroke-width="3"/>
    <path d="M190 222h12" stroke="#ffffff" stroke-width="3" stroke-linecap="round"/>
    <path d="M172 250h48" stroke="#2c233d" stroke-width="3" stroke-linecap="round" stroke-dasharray="6 6"/>
    <!-- arms: hands together, worried -->
    <path d="M158 206c-18 6-22 26-8 32s30-6 40-10" fill="none" stroke="#2c233d" stroke-width="6" stroke-linecap="round"/>
    <path d="M234 206c18 6 22 26 8 32s-30-6-40-10" fill="none" stroke="#2c233d" stroke-width="6" stroke-linecap="round"/>
    <circle cx="196" cy="228" r="8" fill="#ff8d4e" stroke="#2c233d" stroke-width="3"/>

    <!-- head -->
    <g class="head">
      <path d="M196 112v-22" stroke="#2c233d" stroke-width="4" stroke-linecap="round"/>
      <circle class="bulb" cx="196" cy="84" r="9" fill="#ff8d4e" stroke="#2c233d" stroke-width="3"/>
      <rect x="146" y="110" width="100" height="78" rx="22" fill="#ffffff" stroke="#2c233d" stroke-width="3"/>
      <rect x="140" y="136" width="10" height="26" rx="5" fill="#aecbd6" stroke="#2c233d" stroke-width="3"/>
      <rect x="242" y="136" width="10" height="26" rx="5" fill="#aecbd6" stroke="#2c233d" stroke-width="3"/>
      <!-- sad eyes and brows -->
      <path d="M164 141l14 -6M228 141l-14 -6" stroke="#2c233d" stroke-width="3" stroke-linecap="round"/>
      <circle cx="174" cy="152" r="7" fill="#2c233d"/>
      <circle cx="218" cy="152" r="7" fill="#2c233d"/>
      <circle cx="176" cy="150" r="2" fill="#ffffff"/>
      <circle cx="220" cy="150" r="2" fill="#ffffff"/>
      <!-- mouth -->
      <path d="M182 176c8-8 20-8 28 0" fill="none" stroke="#2c233d" stroke-width="3" stroke-linecap="round"/>
      <!-- tear -->
      <path class="tear" d="M170 162c-3 5-4 8-1 10s6-1 4-5z" fill="#1976d2"/>
    </g>
  </g>
</svg>
