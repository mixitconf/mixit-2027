coc.v2.title=Code of conduct
coc.v2.intro=The MiXiT team is committed to building an inclusive event where everyone is welcome. Everyone taking part in the conference, sponsors and volunteers included, agrees to follow this code of conduct.
coc.nav=On this page
coc.help.title=Need help during the event?
coc.help.nav=Need help?
coc.help.step1.title=Find the organising team
coc.help.step1.text=They are easy to spot in their MiXiT t-shirts and hoodies. Contact them right away if there is a problem, whether you are a victim or a witness.
coc.help.step2.title=Trained people listen to you
coc.help.step2.text=For sexist and sexual violence, team members trained to listen wear a specific badge and support you in your steps.
coc.help.step3.title=An anonymous channel
coc.help.step3.text=A dedicated, anonymous communication channel is available during the event.
coc.help.contact=Before or after the event:
coc.essential.title=The essentials
coc.essential.1=Our conference is dedicated to providing a harassment-free experience for everyone, regardless of sexual identity, gender, sexual orientation, age, disability, physical appearance, body size, ethnicity or religion.
coc.essential.2=Sexist and sexual behaviour is strictly forbidden. Sexual content or content conveying gender stereotypes is not appropriate at our event.
coc.essential.3=These rules apply to the whole event: talks, workshops, parties, social networks and other online media.
coc.essential.4=The organisers will take immediate action against anyone who breaks these rules.
coc.essential.5=Any misconduct reported before, during or after the event, or that happened outside of it and is brought to our attention, will lead to an immediate and permanent exclusion from the current edition and any future event run by our association, without refund or legal recourse.
coc.detail.title=In detail
coc.detail.1=Harassment includes spoken or written comments about sexual identity, gender identity, sexual or romantic orientation, age, disability, physical appearance, body size, ethnicity, religion, sexual images in public spaces, deliberate intimidation, stalking, following, harassing photography or recording, sustained disruption of talks or other events, inappropriate physical contact and unwelcome sexual attention.
coc.detail.2=Participants asked to stop any harassing behaviour are expected to comply immediately.
coc.detail.3=Sponsors are also subject to the anti-harassment policy. They must not use sexualised images or materials, nor engage in sexualised activities. Booth staff must not wear sexualised clothing, uniforms or costumes, nor create a sexualised environment.
coc.detail.4=If someone engages in harassing behaviour, the organisers may take any action they deem appropriate, from a warning to an immediate and permanent exclusion from the current edition and any future event run by our association, without refund or legal recourse.
coc.detail.5=Organisers may contact building security or the police, provide escorts and otherwise help those experiencing harassment to feel safe for the duration of the event.
coc.detail.6=We want the event to be a safe environment for everyone, and we expect everyone to follow these rules throughout the event, including talks, workshops, parties, social networks and other online media.
coc.detail.credits=Inspired by

about.v2.title=Who are we?
about.v2.intro=MiXiT is an adventure that started in 2011: a non-profit, independent conference in Lyon, run by volunteers.
about.stats.start=2011
