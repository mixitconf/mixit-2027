faq.title=F.A.Q.
faq.intro=Find below the answers to the most frequently asked questions about MiXiT.

budget.title=Budget Transparency
budget.intro=We are convinced that trust is the foundation of a strong community. That’s why transparency is at the heart of our organization, including how we manage the conference’s funds.
budget.details=Below you will find the main lines of our budget and how contributions (sponsorship, ticketing) are invested to ensure the best possible event for all participants.

budget.lines.title=Main Budget Lines
budget.lines.intro=Our 2026 budget is €130,000, 55% of which comes from ticket sales. It is very similar to previous years. This budget is divided into several key items that reflect our priorities.
budget.lines.speakers.title=Speakers and Content (17%)
budget.lines.speakers.intro=To thank our speakers for their voluntary participation, we invite them to a dinner the night before the conference. We also cover part of their travel and accommodation expenses.
budget.lines.logistics.title=Meals and Crêpes (37%)
budget.lines.logistics.intro=We strive to offer a quality hot meal to our participants while limiting waste. This includes coffee breaks, lunches, and of course, Raph’s famous crêpes! For several years, we have worked with the caterer La Fine Fourchette, who offers zero-waste cuisine.
budget.lines.venue.title=Venue and Logistics (19%)
budget.lines.venue.intro=This expense covers the rental of the conference space. We warmly thank CPE Lyon for welcoming us for years in such a caring way. This venue is an integral part of MiXiT’s identity.
budget.lines.accessibility.title=Accessibility (7%)
budget.lines.accessibility.intro=We want MiXiT to be accessible to as many people as possible. This includes speech-to-text services for the hearing impaired, as well as reserved seats for people with disabilities.
budget.lines.media.title=Media and Communication (14%)
budget.lines.media.intro=We record the sessions on video to make them available after the event. This also covers event photos and communication.
budget.lines.admin.title=Structure (6%)
budget.lines.admin.intro=As a non-profit association, we have administrative costs to manage the event throughout the year (insurance, banks). We also include in this section the amounts we donate to associations as part of the Mixette.

budget.why.title=Why this Transparency?
budget.why.intro=Our goal is not to make a profit but to balance our budget to ensure MiXiT lasts for many more years. By sharing the structure of our expenses:
budget.why.step1=We justify the cost of your ticket: You can see exactly where your investment goes and how it contributes to the event as a whole.
budget.why.step2=We demonstrate our commitment: We want to show you that we manage funds responsibly, prioritizing the participant experience.
budget.questions=If you have any questions about a specific budget item or want to know more about our financial management, feel free to contact us.

