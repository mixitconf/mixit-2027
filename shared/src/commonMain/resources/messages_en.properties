home.hero.newsletter=Subscribe to the newsletter
home.section.news.intro=MiXiT remains true to what has driven it since 2010: coming together, working as a team, questioning the world ethically.
home.section.news.focus=For 2027, we want to refocus the event on topics that stand the test of time: the impact of the massive ongoing transformation on our jobs, our products and our environment, rather than short-term topics that quickly become obsolete.
home.section.news.change=Running a MiXiT edition that looks like the previous ones is no longer an option, because everything has changed. At a time when the current tech conference format is declining, MiXiT's historical positioning makes even more sense.
home.section.news.closing=We hope you'll join us!
