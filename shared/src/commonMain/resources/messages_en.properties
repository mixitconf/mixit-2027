about.story.title=Our story
about.story.1=MiXiT was created by the Lyon JUG and CARA, with a founding principle that still holds: offering Lyon a conference accessible to everyone.
about.story.2=But it is not only about agility or the Java ecosystem. Sessions cover development at large, management, ethics, product… in French as well as in English.
about.story.3=Expert sessions, games and encounters: entrepreneurs, project leads, developers, everyone leaves with ideas for their projects.
about.story.photo=A full lecture hall during a MiXiT talk
about.team.v2.intro=A team of passionate volunteers from many backgrounds, sharing a commitment to inclusion, diversity and ethics in tech. We prepare MiXiT all year long so that it is accessible and rewarding for everyone.
about.volunteers.v2.title=Volunteers
about.volunteers.v2.intro=Welcoming attendees, running sessions, logistics: during the two days, volunteers support the team and create the friendly atmosphere that makes MiXiT.

