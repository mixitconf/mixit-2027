home.section.news.title=An edition like no other
home.section.news.when=The next edition of MiXiT will take place on April 22 and 23, 2027 at CPE (Campus Université Lyon 1) in Villeurbanne.
home.section.news.birthday=And for the record, MiXiT will celebrate its 15th anniversary 🥳! We are preparing a program full of surprises and emotions and, of course, Raph's famous crêpes will be there.
home.section.news.birthday2=Thanks to you, we have made MiXiT a must-attend event in the French tech scene while maintaining our independence and editorial line. We look forward to seeing you all together to celebrate this moment.
home.section.news.ticket=Tickets will go on sale by the end of the year, stay tuned!
home.section.news.sponsor=Visit the <a href="/en/sponsors">sponsors</a> page to discover our partnership offers and help us make this edition a success.
home.section.news.cfp=The <a href="https://sessionize.com/mixit-2026/" target="cfp">Call for Papers</a> will open on the 10th November. Do not hesitate to propose a talk, workshop, or any other format that you think would enrich our program.
home.section.news.newsletter=Subscribe to our <a href="/newsletter-subscribe" target="newsletter">newsletter</a> to receive all information about the 2027 edition and never miss important announcements.

home.section.schedule.annoucement.title=📢 The MiXiT 2027 Program is Live !
home.section.schedule.annoucement.subtitle=The wait is finally over. After weeks of intense deliberation (and a lot of coffee), our selection committee has made its final call. The speaker selection is officially closed, and we are thrilled to unveil the full program for this year’s edition.
home.section.schedule.annoucement.link=Explore the full program
home.section.nextedition.title=📢 See You in 2027!
home.section.nextedition.when=The next edition of MiXiT will take place on April 22 and 23, 2027, at the same location as this year.
home.section.nextedition.subtitle=We will share more details about this new edition by the end of October. Stay tuned!
home.section.nextedition.podcast=In the meantime, check out our podcast <a href="#home.section.onair.title">MiXiT On Air</a> to keep up with tech news all year round.
home.section.sales.annoucement.title=Ticketing: Two Chances to Join Us!
home.section.sales.annoucement.link=Access the ticketing platform
home.section.sales.annoucement.subtitle=To ensure everyone has a fair shot at grabbing a ticket—regardless of their schedule or daily constraints—we are splitting the ticket release into two separate windows.
home.section.sales.annoucement.description=Inclusion is at the heart of MiXiT. Whether you're a "lunch-break booker" or a "night-owl surfer," we’ve got you covered:
home.section.sales.annoucement.first=Round 1: Monday, February 9th at 1:00 PM (CET).
home.section.sales.annoucement.second=Round 2: Monday, February 23rd at 9:00 PM (CET).
home.section.sales.annoucement.warning=Tickets usually fly off the shelves at lightning speed. We highly recommend setting an alarm and having your keyboard ready!


home.section.onair.title=MiXiT podcast!
home.section.onair.subtitle=Launched after the 2025 edition, our podcast extends the spirit of the Lyon-based conference by exploring its core values and themes all year round.
home.section.onair.description=We regularly release episodes exploring a wide range of enriching topics. Whether you are a developer, designer, product manager, or simply curious about current trends, this podcast is for you.
home.section.onair.joinus=Join us now and don't miss any episode that promises to be rich in discoveries and learning. Follow us today on the platforms below and stay connected to keep up with all the MiXiT news!


home.section.values.title=Our Values
home.section.values.accessibility.title=Accessibility
home.section.values.accessibility.desc=We prioritize accessibility at MiXiT, affirming the right of everyone to fully participate in the conference. We are committed to eliminating barriers that may limit participation, whether related to mobility, hearing, or other specific needs. To achieve this, we have implemented several initiatives, including: live transcription for the hard of hearing, priority seating for people with disabilities and pregnant persons, a dedicated room for breastfeeding parents
home.section.values.eco.title=Eco-Friendly Approach
home.section.values.eco.desc=We aim to minimize our carbon footprint by working with a zero-waste and locally sourced caterer, recycling waste and using eco-responsible suppliers whenever possible, considering the social and environmental impact of our partners
home.section.values.safe.title=Safe place
home.section.values.safe.desc=We strive to create a safe and secure environment during the two days of MiXiT. This commitment is reflected not only in our sessions but also in the way the event is organized. Our team is trained by the European Association Against Violence Against Women at Work (AVFT) to handle cases of harassment or sexual assault.

